# Sprout's build settings (fm1-base's tools/build.py: ./build.sh)
name = "AMB"                   # the build's FILES keep AMB-1's name (amb.fwsc, amb-X.Y.fwsc: the tests and the release workflow
                               # call them so); what people see is Sprout (usb_manufacturer, usb_product, APP_NAME)
id_prefix = "FM-1_7"           # package identity: dev FM-1_700, releases FM-1_7XXYYZZ (as AMB-1: Sprout is its update)
usb_manufacturer = "Sprout"
usb_product = "Sprout FM-1"
ble = false                    # Sprout never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "A Pocket Scion companion for the FM-1, derived from AMB-1"
repo = "https://github.com/Ephio/sprout"
licence = "MPL-2.0"
credits = "Derived from AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "Paolo Pino"
description = "Sprout is a Pocket Scion companion for the M-VAVE FM-1, derived from AMB-1 by Charles Vestal. Eight scenes (a cherry garden, mycelium, a growing Monstera, the Earth, a seagrass meadow, a river at night, a lighthouse in a storm and a beach at sunset) answer the notes and CCs that the Instruo Pocket Scion sends over MIDI: every channel rings its own bell, a CC map steers the voices, the effects and a granulator, and a quiet generative bed plays underneath."
tags = ["ambient", "generative", "fm"]
install = "https://github.com/Ephio/sprout"
site = "https://github.com/Ephio/sprout"
screenshot = "docs/img/screen-garden.png"
